name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Build independent frontend image
        run: docker build -t appmon-frontend-ci .
      - name: Validate production Nginx configuration
        run: docker run --rm --add-host web:127.0.0.1 appmon-frontend-ci nginx -t
      - name: Build Python collector and API image
        working-directory: .
        run: docker build -t appmon-backend-ci .
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-test-password
      MYSQL_ROOT_PASSWORD: ci-test-password
      MYSQL_DATABASE: appmon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.4'
          root-password: ci-test-password
          my-cnf: |
            character-set-server=utf8mb4
            collation-server=utf8mb4_bin
      - run: python -m pip install ".[test]"
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/create_ci_database.py
      - run: appmon init
      - run: appmon status
      - run: appmon keywords import examples/keywords-sea.json
      - run: appmon keywords list
      - run: appmon keywords app google com.example.app
