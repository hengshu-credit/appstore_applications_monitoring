name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Build independent frontend image
        run: docker build -t appmon-frontend-ci .
      - name: Validate production Nginx configuration
        run: docker run --rm --add-host web:127.0.0.1 appmon-frontend-ci nginx -t
      - name: Build Python collector and API image
        working-directory: .
        run: docker build -t appmon-backend-ci .
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    env:
      OCEANBASE_DATABASE: appmon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python scripts/configure_storage.py
      - run: docker compose -f compose.yaml --env-file .env up -d --build app-init
      - name: Wait for application bootstrap
        run: |
          id=$(docker compose -f compose.yaml ps -aq app-init)
          code=$(docker wait "$id")
          test "$code" = 0
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: appmon init
      - run: appmon status
      - run: appmon keywords import examples/keywords-sea.json
      - run: appmon keywords list
      - run: appmon keywords app google com.example.app
      - if: always()
        run: docker compose -f compose.yaml --env-file .env down -v
  windows-client:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m compileall -q src tests
      # OceanBase server runs on Linux. Run all server integration tests above;
      # retain the portable client/parser suite on Windows without substituting MySQL.
      - run: python scripts/run_client_tests.py
