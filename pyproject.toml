[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appstore-applications-monitoring"
version = "0.4.0"
description = "Resumable Google Play and Apple App Store application pool monitoring"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "PyMySQL[rsa]>=1.2,<2", "python-dotenv>=1,<2", "fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55"]

[project.optional-dependencies]
test = ["httpx2>=2.16,<3"]

[project.scripts]
appmon = "appmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/appmon/licenses" = ["licenses/appgoblin-play-scraper.txt", "licenses/appgoblin-data.txt", "licenses/mradex-google-play-scraper.txt", "licenses/app-store-scraper.txt", "licenses/unicode-cldr.txt"]

[tool.setuptools.package-data]
appmon = ["apple_markets.json", "apple_countries.json", "google_chart_request.json", "store_catalog.json"]
