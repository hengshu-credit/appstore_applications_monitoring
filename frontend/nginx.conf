server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Re-resolve Docker service names after backend container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend web:8765;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location = /api/docs {
        expires -1;
        try_files /api-docs.html =404;
    }
    location = /api/docs/ { return 308 /api/docs; }
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /api/data-sources/marketdata/datasets {
        client_max_body_size 64m;
        proxy_pass http://$api_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://$api_backend;
        proxy_set_header Host $http_host;
    }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
