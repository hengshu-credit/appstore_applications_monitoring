server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location /api/ {
        proxy_pass http://web:8765;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://web:8765;
        proxy_set_header Host $http_host;
    }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
