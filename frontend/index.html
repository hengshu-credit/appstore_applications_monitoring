<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>衡枢·观星</title>
    <link rel="icon" type="image/svg+xml" href="/images/hengshucredit.svg" />
    <link
      rel="preload"
      href="/fonts/font.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="衡枢·观星 — 星河璀璨，万象浮沉。双商店应用监控、榜单、关键词与竞品分析。"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="account-locked">
    <aside class="app-sidebar">
      <a class="brand" href="#overview" aria-label="衡枢·观星，返回监控概览">
        <img
          class="brand-logo"
          src="/images/hengshucredit.svg"
          alt=""
          width="36"
          height="36"
        />
        <span class="brand-copy">
          <strong>衡枢·观星</strong>
          <small>星河璀璨，万象浮沉</small>
        </span>
      </a>
      <div class="nav-label">应用情报工作台</div>
      <nav id="navigation" aria-label="主导航"></nav>
      <button
        id="sidebar-toggle"
        type="button"
        aria-label="收起侧边栏"
        title="收起侧边栏"
        aria-expanded="true"
        aria-controls="navigation"
      >
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m14 5-7 7 7 7m5-14-7 7 7 7" />
        </svg>
      </button>
    </aside>
    <div class="shell">
      <header>
        <div class="page-heading">
          <span class="eyebrow">WORKSPACE / INTELLIGENCE</span>
          <h1 id="page-title">监控概览</h1>
          <button
            id="refresh-page"
            type="button"
            class="link page-refresh"
            aria-label="刷新当前页面"
            title="刷新当前页面"
          ></button>
        </div>
        <div class="market">
          <div class="market-field store-field">
            <span id="store-label">应用商店</span
            ><input id="global-store" type="hidden" value="google" />
            <button
              id="store-trigger"
              type="button"
              class="market-trigger secondary"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="store-menu"
              aria-labelledby="store-label store-value"
            >
              <span class="market-value" id="store-value"></span
              ><svg
                class="ui-icon chevron"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="store-menu" class="market-menu" hidden>
              <div
                role="listbox"
                aria-label="应用商店"
                aria-multiselectable="true"
                aria-describedby="store-selection-note"
              ></div>
              <p id="store-selection-note" class="sub market-menu-note">
                点击商店可多选，至少保留一个
              </p>
            </div>
          </div>
          <div class="country-field">
            <span id="country-label">国家 / 地区</span
            ><input id="global-country" value="us" type="hidden" /><button
              id="country-trigger"
              class="picker-trigger secondary"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-labelledby="country-label country-value"
            >
              <span id="country-value">美国 US</span
              ><span aria-hidden="true">⌄</span>
            </button>
          </div>
          <div class="market-field language-field">
            <span id="language-label">请求语言</span
            ><input id="global-language" type="hidden" value="auto" />
            <button
              id="language-trigger"
              type="button"
              class="market-trigger secondary"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="language-menu"
              aria-labelledby="language-label language-value"
            >
              <span class="market-value" id="language-value"></span
              ><svg
                class="ui-icon chevron"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="language-menu" class="market-menu" hidden>
              <input
                type="search"
                placeholder="搜索名称或语言代码"
                aria-label="搜索请求语言"
              />
              <div role="listbox" aria-label="请求语言"></div>
            </div>
          </div>
          <div class="market-actions">
            <div class="account-dropdown">
              <button
                id="account-trigger"
                class="secondary"
                aria-label="我的账户"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="account-menu"
              >
                <span id="account-avatar" aria-hidden="true">U</span
                ><span id="account-name">我的账户</span
                ><span aria-hidden="true">⌄</span>
              </button>
              <div id="account-menu" role="menu" hidden>
                <button id="account-settings" role="menuitem" type="button">
                  <svg
                    class="ui-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg
                  ><span>用户设置</span>
                </button>
                <button id="open-theme" role="menuitem" type="button">
                  主题设置
                </button>
                <button id="logout-account" role="menuitem" type="button">
                  <svg
                    class="ui-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M12 3v9M7 5a9 9 0 1 0 10 0" /></svg
                  ><span>退出登录</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <section class="workspace-context" aria-label="当前工作区">
        <nav id="workspace-pages" aria-label="工作区页面" hidden></nav>
        <div class="workspace-intro">
          <blockquote id="workspace-description"></blockquote>
          <div id="workspace-actions"></div>
        </div>
      </section>
      <main id="content" aria-live="polite">
        <div class="empty">正在连接数据工作台…</div>
      </main>
      <footer class="app-footer">
        <span class="footer-note"
          >开源应用基线 · 商店公开观察 · 时间按浏览器所在时区显示</span
        >
        <div class="footer-center">
          <span class="footer-copyright"
            >© 2026
            <a
              href="https://hengshucredit.com/"
              target="_blank"
              rel="noopener noreferrer"
              >上海衡枢真信科技有限公司</a
            >
            · ALL RIGHTS RESERVED</span
          >
          <span
            >开源地址：<a
              href="https://github.com/hengshu-credit"
              target="_blank"
              rel="noopener noreferrer"
              >github.com/hengshu-credit</a
            ></span
          >
          <a
            href="https://github.com/itlubber"
            target="_blank"
            rel="noopener noreferrer"
            >github.com/itlubber</a
          >
          <span>微信：itlubber</span><span>公众号：itlubber_art</span>
        </div>
        <a
          class="footer-api"
          href="/api/openapi.json"
          target="_blank"
          rel="noopener"
          >API 定义</a
        >
      </footer>
    </div>
    <div id="toast" role="status"></div>
    <dialog id="login" aria-label="账户登录"></dialog>
  </body>
</html>
