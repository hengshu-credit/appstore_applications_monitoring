<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>衡枢·观星</title>
    <link rel="icon" type="image/svg+xml" href="/images/hengshucredit.svg" />
    <link
      rel="preload"
      href="/fonts/font.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="衡枢·观星 — 星河璀璨，万象浮沉。双商店应用监控、榜单、关键词与竞品分析。"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <aside>
      <a class="brand" href="#overview" aria-label="衡枢·观星，返回监控概览">
        <img
          class="brand-logo"
          src="/images/hengshucredit.svg"
          alt=""
          width="36"
          height="36"
        />
        <span class="brand-copy">
          <strong>衡枢·观星</strong>
          <small>星河璀璨，万象浮沉</small>
        </span>
      </a>
      <div class="nav-label">应用情报工作台</div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="side-note">
        <span class="status-dot"></span>公开观察 · 可追溯历史
        <p>保留来源与采集时间<br />以实际观察记录为依据</p>
      </div>
    </aside>
    <div class="shell">
      <header>
        <div>
          <span class="eyebrow">WORKSPACE / INTELLIGENCE</span>
          <h1 id="page-title">监控概览</h1>
        </div>
        <div class="market">
          <div class="market-field store-field">
            <span id="store-label">应用商店</span
            ><input id="global-store" type="hidden" value="google" />
            <button
              id="store-trigger"
              type="button"
              class="market-trigger secondary"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="store-menu"
              aria-labelledby="store-label store-value"
            >
              <span class="market-value" id="store-value"></span
              ><svg
                class="ui-icon chevron"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="store-menu" class="market-menu" hidden>
              <div role="listbox" aria-label="应用商店"></div>
            </div>
          </div>
          <div class="country-field">
            <span id="country-label">国家 / 地区</span
            ><input id="global-country" value="us" type="hidden" /><button
              id="country-trigger"
              class="picker-trigger secondary"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-labelledby="country-label country-value"
            >
              <span id="country-value">美国 US</span
              ><span aria-hidden="true">⌄</span>
            </button>
          </div>
          <div class="market-field language-field">
            <span id="language-label">请求语言</span
            ><input id="global-language" type="hidden" value="auto" />
            <button
              id="language-trigger"
              type="button"
              class="market-trigger secondary"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="language-menu"
              aria-labelledby="language-label language-value"
            >
              <span class="market-value" id="language-value"></span
              ><svg
                class="ui-icon chevron"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="language-menu" class="market-menu" hidden>
              <input
                type="search"
                placeholder="搜索名称或语言代码"
                aria-label="搜索请求语言"
              />
              <div role="listbox" aria-label="请求语言"></div>
            </div>
          </div>
          <div class="market-actions">
            <button id="refresh-page" class="secondary">刷新</button
            ><button id="open-theme" class="secondary">主题设置</button>
          </div>
        </div>
      </header>
      <main id="content" aria-live="polite">
        <div class="empty">正在连接数据工作台…</div>
      </main>
      <footer>
        AppGoblin 提供应用基线 · 商店公开观察 · 时间按浏览器所在时区显示
        <a href="/api/openapi.json" target="_blank" rel="noopener">API 定义</a>
      </footer>
    </div>
    <div id="toast" role="status"></div>
    <dialog id="login">
      <form id="login-form">
        <h2>连接工作台</h2>
        <p>此服务已启用访问保护，请输入部署时设置的访问令牌。</p>
        <label
          >访问令牌<input
            name="token"
            type="password"
            required
            autocomplete="off" /></label
        ><button type="submit">连接</button>
        <p id="login-error" role="alert"></p>
      </form>
    </dialog>
  </body>
</html>
