# Global ID pool; detail availability is verified separately per configured storefront.
data_dir = "data"
countries = ["us"]
language = "en"
refresh_hours = 24
missing_confirmations = 3
missing_recheck_hours = 24
lease_seconds = 600
timeout_seconds = 30
# Local proxy compatibility; TLS certificate verification remains enabled.
tls_maximum_version = "1.2"
min_free_gb = 2
google_interval_seconds = 2.5
apple_interval_seconds = 3.5
# Shared across both stores and all workers; editable live in collection center.
global_interval_seconds = 5
cooldown_seconds = 900
batch_size = 200
# Same-country/language Apple detail IDs per HTTP lookup (1 disables batching).
apple_lookup_batch_size = 50
# Same-market Google detail/search/chart/review calls per HTTP request.
google_rpc_batch_size = 20
discovery_hours = 24
seed_sync_hours = 24
search_terms = ["finance", "business", "education", "health", "games", "shopping", "travel", "tools"]
google_categories = ["FINANCE", "BUSINESS", "EDUCATION", "HEALTH_AND_FITNESS", "GAME", "SHOPPING", "TRAVEL_AND_LOCAL", "TOOLS"]
# Optional HTTP(S)_PROXY environment variables; no credentials in this file.
