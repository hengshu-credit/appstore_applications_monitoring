name: appstore-applications-monitoring
services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appstore_applications_monitoring}
      MYSQL_USER: ${MYSQL_USER:-appmon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-buffer-pool-size=512M
      - --max-allowed-packet=64M
      - --skip-log-bin
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  monitor:
    image: ${APPMON_BACKEND_IMAGE:-appmon-backend:local}
    build: .
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      PYTHONUNBUFFERED: "1"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appstore_applications_monitoring}
      MYSQL_USER: ${MYSQL_USER:-appmon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      HTTP_PROXY: ${APPMON_HTTP_PROXY:-}
      HTTPS_PROXY: ${APPMON_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,mysql,web,frontend
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
  keywords:
    extends:
      service: monitor
    profiles: [keywords]
    command: ["appmon", "keywords", "daemon"]
  web:
    extends:
      service: monitor
    profiles: [console]
    command: ["appmon", "web", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:${APPMON_WEB_PORT:-8765}:8765"
    environment:
      APPMON_COOKIE_SECURE: ${APPMON_COOKIE_SECURE:-false}
      APPMON_ALLOWED_HOSTS: ${APPMON_ALLOWED_HOSTS:-localhost,127.0.0.1}
      APPLE_ADS_ACCESS_TOKEN: ${APPLE_ADS_ACCESS_TOKEN:-}
      APPLE_ADS_AD_ACCOUNT_ID: ${APPLE_ADS_AD_ACCOUNT_ID:-}
  console:
    extends:
      service: monitor
    profiles: [console]
    command: ["appmon", "console", "daemon"]
  frontend:
    image: ${APPMON_FRONTEND_IMAGE:-appmon-frontend:local}
    build: ./frontend
    profiles: [console]
    restart: unless-stopped
    ports:
      - "${APPMON_BIND_ADDRESS:-127.0.0.1}:${APPMON_FRONTEND_PORT:-5173}:80"
    depends_on:
      - web
