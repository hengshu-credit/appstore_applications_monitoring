name: appstore-applications-monitoring
services:
  oceanbase:
    image: oceanbase/oceanbase-ce:4.4.2.1-101000022026050611
    restart: unless-stopped
    ports: ["127.0.0.1:${OCEANBASE_PORT:-2881}:2881"]
    mem_limit: ${OCEANBASE_CONTAINER_MEMORY_LIMIT:-8g}
    environment:
      MODE: MINI
      OB_TENANT_NAME: appmon
      OB_DATABASE: ${OCEANBASE_DATABASE:-appstore_applications_monitoring}
      OB_TENANT_PASSWORD: ${OCEANBASE_PASSWORD:?Run scripts/configure_storage.py}
      OB_SYS_PASSWORD: ${OCEANBASE_SYS_PASSWORD:?Run scripts/configure_storage.py}
      OB_MEMORY_LIMIT: ${OCEANBASE_MEMORY_LIMIT:-6G}
      OB_DATAFILE_SIZE: ${OCEANBASE_DATAFILE_SIZE:-5G}
      OB_LOG_DISK_SIZE: ${OCEANBASE_LOG_DISK_SIZE:-5G}
    volumes:
      - oceanbase_data:/root/ob
      - oceanbase_config:/root/.obd/cluster
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$OB_TENANT_PASSWORD obclient -h 127.0.0.1 -P2881 -uroot@appmon -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
  storage-init:
    build: .
    image: ${APPMON_BACKEND_IMAGE:-appmon-backend:local}
    env_file: .env
    environment:
      OCEANBASE_HOST: oceanbase
      OCEANBASE_PORT: "2881"
    command: ["python", "-m", "appmon.storage_init"]
    depends_on:
      oceanbase:
        condition: service_healthy
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: ["server", "-ip=${SEAWEEDFS_ADVERTISE_HOST:-seaweedfs}", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024", "-volume.max=100"]
    ports:
      - "${STORAGE_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - ${SEAWEEDFS_DATA_DIR:-seaweed_data}:/data
      - ./data/runtime/filer.toml:/etc/seaweedfs/filer.toml:ro
      - ./data/runtime/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
  app-init:
    extends:
      service: storage-init
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
    command: ["python", "-m", "appmon.storage_init", "--application"]
    volumes: ["./config.toml:/app/config.toml:ro"]
    depends_on:
      seaweedfs:
        condition: service_started
  monitor:
    image: ${APPMON_BACKEND_IMAGE:-appmon-backend:local}
    build: .
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      PYTHONUNBUFFERED: "1"
      OCEANBASE_HOST: oceanbase
      OCEANBASE_PORT: "2881"
      OCEANBASE_DATABASE: ${OCEANBASE_DATABASE:-appstore_applications_monitoring}
      OCEANBASE_USER: ${OCEANBASE_USER:-root@appmon}
      OCEANBASE_PASSWORD: ${OCEANBASE_PASSWORD:?Set OCEANBASE_PASSWORD in .env}
      HTTP_PROXY: ${APPMON_HTTP_PROXY:-}
      HTTPS_PROXY: ${APPMON_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,oceanbase,seaweedfs,web,frontend
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
      S3_BUCKET: ${S3_BUCKET:-appmon}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run scripts/configure_storage.py}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run scripts/configure_storage.py}
      APPLE_ADS_ACCESS_TOKEN: ${APPLE_ADS_ACCESS_TOKEN:-}
      APPLE_ADS_AD_ACCOUNT_ID: ${APPLE_ADS_AD_ACCOUNT_ID:-}
    depends_on:
      app-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
  keywords:
    extends:
      service: monitor
    profiles: [keywords]
    command: ["appmon", "keywords", "daemon"]
  web:
    extends:
      service: monitor
    profiles: [console]
    command: ["appmon", "web", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:${APPMON_WEB_PORT:-8765}:8765"
    environment:
      APPMON_COOKIE_SECURE: ${APPMON_COOKIE_SECURE:-false}
      APPMON_ALLOWED_HOSTS: ${APPMON_ALLOWED_HOSTS:-localhost,127.0.0.1}
  console:
    extends:
      service: monitor
    profiles: [console]
    command: ["appmon", "console", "daemon"]
  frontend:
    image: ${APPMON_FRONTEND_IMAGE:-appmon-frontend:local}
    build: ./frontend
    profiles: [console]
    restart: unless-stopped
    ports:
      - "${APPMON_BIND_ADDRESS:-127.0.0.1}:${APPMON_FRONTEND_PORT:-5173}:80"
    depends_on:
      - web

volumes:
  oceanbase_data:
  oceanbase_config:
  seaweed_data:
